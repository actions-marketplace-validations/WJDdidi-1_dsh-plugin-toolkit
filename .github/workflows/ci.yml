name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The daily schedule is the fallback that gives every platform a run when a
  # push cannot acquire a runner.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep the push/PR macOS leg on the predictable Intel image. The Linux
        # arm64 job below covers the architecture the plugin is loaded on.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  linux-arm64:
    name: node 22 on ubuntu-24.04-arm (arm64)
    # The plugin is loaded by an arm Mac app, but GitHub's hosted arm64 macOS
    # pool cancels a job that never acquires a runner after about fifteen
    # minutes, and a cancelled job fails the workflow even with
    # continue-on-error. Test the arm64 architecture on the free Linux arm64
    # runner instead; macOS itself is covered by the macos-15-intel matrix
    # above, and the suite has no macOS-only assertions.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      runner: ${{ steps.checkout.outcome }}
      arch: ${{ steps.arch.outcome }}
      tests: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The label asks for an arm64 runner; this proves the job actually got
      # one. Without it a label change (or a label silently served by x64)
      # would turn the arm64 leg into a green x64 run that covers nothing.
      - name: the runner really is arm64
        id: arch
        run: |
          arch="$(node -p 'process.arch')"
          if [ "$arch" != "arm64" ]; then
            echo "expected an arm64 runner, got $arch"
            exit 1
          fi
          echo "arm64 runner: $arch"
      - run: npm ci
      - id: tests
        run: npm test

  arm64-gate:
    name: arm64 job did not hide a test failure
    needs: linux-arm64
    if: always() && needs.linux-arm64.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: the arm64 job ran its tests
        env:
          RUNNER_OUTCOME: ${{ needs.linux-arm64.outputs.runner }}
          ARCH_OUTCOME: ${{ needs.linux-arm64.outputs.arch }}
          TESTS_OUTCOME: ${{ needs.linux-arm64.outputs.tests }}
        run: |
          if [ "$RUNNER_OUTCOME" != "success" ]; then
            echo "the arm64 job did not complete its checkout (checkout: ${RUNNER_OUTCOME:-not run})"
            exit 1
          fi
          if [ "$ARCH_OUTCOME" != "success" ]; then
            echo "the arm64 job did not prove it ran on arm64 (arch: ${ARCH_OUTCOME:-not run})"
            exit 1
          fi
          if [ "$TESTS_OUTCOME" != "success" ]; then
            echo "the arm64 job ran but its tests did not pass (tests: ${TESTS_OUTCOME:-not run})"
            exit 1
          fi
          echo "arm64 tests: success"

  dogfood:
    name: the tool on a real plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bin/dsh-plugin.mjs doctor fixtures/good
      - name: a broken plugin must fail
        run: |
          if node bin/dsh-plugin.mjs doctor fixtures/no-engines; then
            echo "doctor accepted a plugin with no host range"; exit 1
          fi
      - run: node bin/dsh-plugin.mjs release fixtures/good --dry-run
